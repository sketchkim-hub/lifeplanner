# Capacitor Android build.
# 수동 실행 또는 android-v* 태그에서 아티팩트만 만듭니다.
# Play 업로드, GitHub Release, 태그 생성은 하지 않습니다.
#
# 필요 Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_B64         : 기존 TWA와 같은 android.p12 의 base64
#   BUBBLEWRAP_KEYSTORE_PASSWORD : 키스토어 비밀번호
#   BUBBLEWRAP_KEY_PASSWORD      : 키 비밀번호
# 선택 Variable:
#   ANDROID_KEY_ALIAS            : 비어 있으면 lifeplanner
#
# Play 앱 서명을 쓰는 앱이면 이 키스토어는 업로드 키입니다.
# Google이 앱 서명 키로 다시 서명하므로, 업로드 키만 이전과 같으면 업데이트가 됩니다.
name: Capacitor Android Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'debug는 테스트용 APK, release는 Play 업로드용 서명 AAB'
        type: choice
        options:
          - release
          - debug
        default: release
  push:
    tags:
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check shell and web copy
        run: npm test

      - name: Bundle web app and sync Capacitor
        run: npm run sync:android

      - name: Resolve variant
        id: variant
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=release" >> "$GITHUB_OUTPUT"
          fi

      # ubuntu-latest sets ANDROID_HOME but does not put sdkmanager on PATH.
      # The binary is $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME and ANDROID_SDK_ROOT are unset." >&2
            exit 1
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            found="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
            if [ -n "$found" ] && [ -x "$found" ]; then
              SDKMANAGER="$found"
            fi
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "No preinstalled sdkmanager. Downloading command-line tools." >&2
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/cmdtools.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
            unzip -q "$tmp/cmdtools.zip" -d "$tmp"
            bin_dir="$(find "$tmp" -type d -name bin | head -n 1)"
            if [ -z "$bin_dir" ]; then
              echo "Command-line tools archive has no bin directory." >&2
              exit 1
            fi
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            cp -a "$(dirname "$bin_dir")/." "$SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          set -o pipefail
          if [ ! -d "$SDK_ROOT/platforms/android-36" ]; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36"
          else
            echo "platforms/android-36 is already installed"
          fi
          test -d "$SDK_ROOT/platforms/android-36"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > android/local.properties
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Decode upload keystore
        if: steps.variant.outputs.name == 'release'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/android-upload.p12
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_B64}" ]; then
            echo "Secret ANDROID_KEYSTORE_B64 is empty." >&2
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_B64}" | base64 -d > "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"

      - name: Build debug APK
        if: steps.variant.outputs.name == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release AAB
        if: steps.variant.outputs.name == 'release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-upload.p12
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        if: steps.variant.outputs.name == 'debug'
        uses: actions/upload-artifact@v5
        with:
          name: lifeplanner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed AAB
        if: steps.variant.outputs.name == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: lifeplanner-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
