<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라이프플래너 - 경건에 이르는 훈련</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#212B42">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- Firebase (회원가입/로그인 + 데이터 저장) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<!-- PDF 책자 생성 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --paper:#F5F0E4;
  --paper-deep:#EDE5D2;
  --card:#FFFDF7;
  --ink:#22271F;
  --ink-soft:#5B5A4E;
  --navy:#212B42;
  --navy-soft:#3B4560;
  --gold:#B8863E;
  --gold-soft:#D9AE6E;
  --sage:#5B6B4F;
  --sage-soft:#7C8C6D;
  --brick:#8B4A42;
  --line:#DED2B4;
  --radius:14px;
  --shadow:0 2px 10px rgba(33,27,10,0.08), 0 1px 2px rgba(33,27,10,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 15% 8%, rgba(184,134,62,0.07), transparent 40%),
    radial-gradient(circle at 90% 85%, rgba(91,107,79,0.07), transparent 45%);
  color:var(--ink);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.serif{font-family:'Noto Serif KR',serif;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--gold-soft);color:var(--navy);}

.app{max-width:1180px;margin:0 auto;padding:22px 18px 90px;}

/* ---------- Header ---------- */
.app-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 4px 20px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
  gap:12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-flame{
  width:34px;height:34px;flex:none;position:relative;
}
.brand-flame svg{width:100%;height:100%;display:block;animation:flicker 3.2s ease-in-out infinite;}
@keyframes flicker{
  0%,100%{transform:scale(1) rotate(0deg);}
  25%{transform:scale(1.04,0.97) rotate(-1.5deg);}
  50%{transform:scale(0.97,1.03) rotate(1deg);}
  75%{transform:scale(1.02,0.98) rotate(-0.5deg);}
}
.brand-title{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-0.2px;}
.brand-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
.today-pill{
  font-size:12.5px;color:var(--navy-soft);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  box-shadow:var(--shadow);white-space:nowrap;
}

/* ---------- Tabs ---------- */
.tabbar{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;
  scrollbar-width:thin;
}
.tabbar::-webkit-scrollbar{height:4px;}
.tabbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.tab-btn{
  flex:none;border:1px solid transparent;background:transparent;
  color:var(--ink-soft);font-size:14px;font-weight:500;
  padding:9px 14px;border-radius:10px;white-space:nowrap;
  transition:all .15s ease;
}
.tab-btn:hover{background:rgba(184,134,62,0.1);color:var(--navy);}
.tab-btn.active{
  background:var(--navy);color:#F7F1E1;font-weight:600;
  box-shadow:var(--shadow);
}
.panel{display:none;animation:fadein .25s ease;}
.panel.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- Generic ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;
}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1.3fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.section-title{font-size:18px;font-weight:700;color:var(--navy);margin:0 0 4px;}
.section-desc{font-size:13px;color:var(--ink-soft);margin:0 0 16px;line-height:1.6;}

.btn{
  border:1px solid var(--navy);background:var(--navy);color:#F7F1E1;
  padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.btn.outline{background:transparent;color:var(--navy);}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff;}
.btn.sage{background:var(--sage);border-color:var(--sage);color:#fff;}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
.btn.small{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn.danger{background:transparent;border-color:var(--brick);color:var(--brick);}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--navy-soft);margin-bottom:5px;}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  font-size:13.5px;background:#fffef9;color:var(--ink);
}
.field textarea{resize:vertical;min-height:70px;line-height:1.6;}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--gold-soft);outline-offset:1px;border-color:var(--gold);}

.badge{
  display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:rgba(91,107,79,0.14);color:var(--sage);
}
.badge.gold{background:rgba(184,134,62,0.16);color:var(--gold);}
.badge.brick{background:rgba(139,74,66,0.14);color:var(--brick);}

.empty{
  text-align:center;color:var(--ink-soft);font-size:13px;padding:26px 10px;
  border:1.5px dashed var(--line);border-radius:10px;
}

/* ---------- Home ---------- */
.hero{
  background:linear-gradient(135deg,var(--navy) 0%,#2B3652 100%);
  color:#F3EDDC;border-radius:18px;padding:30px 26px;position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(217,174,110,0.22),transparent 70%);
}
.hero-eyebrow{font-size:12px;letter-spacing:1.5px;color:var(--gold-soft);font-weight:700;text-transform:uppercase;}
.hero-verse{font-family:'Noto Serif KR',serif;font-size:20px;line-height:1.7;margin:10px 0 4px;max-width:640px;}
.hero-verse-ref{font-size:13px;color:#CBB88A;}
.stat-row{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap;}
.stat{
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);
  border-radius:12px;padding:12px 16px;min-width:120px;
}
.stat b{display:block;font-size:22px;font-family:'Noto Serif KR',serif;}
.stat span{font-size:11.5px;color:#CBC2A8;}

/* ---------- Flip card (signature element) ---------- */
.flip-zone{perspective:1200px;}
.flip-card{
  position:relative;width:100%;min-height:150px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1);
}
.flip-card.flipped{transform:rotateY(180deg);}
.flip-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;
  padding:20px;display:flex;flex-direction:column;justify-content:center;
  border:1px solid var(--line);
}
.flip-front{
  background:var(--card);
  background-image:repeating-linear-gradient(180deg,transparent,transparent 27px,rgba(184,134,62,0.09) 28px);
}
.flip-front::before{
  content:"";position:absolute;left:14px;top:0;bottom:0;width:1px;background:rgba(139,74,66,0.25);
}
.flip-back{
  transform:rotateY(180deg);
  background:linear-gradient(160deg,var(--navy),#2B3652);color:#F3EDDC;
}
.flip-hint{position:absolute;bottom:8px;right:12px;font-size:10.5px;color:var(--ink-soft);opacity:.65;}
.flip-back .flip-hint{color:#CBC2A8;}
.card-ref{font-family:'Noto Serif KR',serif;font-weight:700;font-size:16px;color:var(--navy);padding-left:16px;}
.card-cat{padding-left:16px;margin-bottom:6px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.3px;}
.card-text{font-size:14.5px;line-height:1.75;}
.card-author{font-size:12px;color:var(--gold-soft);margin-top:10px;font-weight:600;}

/* ---------- Reading plan ---------- */
.progress-wrap{margin-bottom:18px;}
.progress-bar-bg{height:10px;border-radius:999px;background:var(--paper-deep);overflow:hidden;border:1px solid var(--line);}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--sage));border-radius:999px;transition:width .3s ease;}
.progress-label{font-size:12.5px;color:var(--ink-soft);margin-top:6px;display:flex;justify-content:space-between;}
.plan-controls{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:520px;overflow:auto;padding:4px 2px;}
.plan-day{
  border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 11px;font-size:12px;
  display:flex;flex-direction:column;gap:3px;transition:background .15s ease;
}
.plan-day.done{background:rgba(91,107,79,0.12);border-color:var(--sage-soft);}
.plan-day .d-num{font-weight:700;color:var(--navy);font-size:11.5px;}
.plan-day .d-refs{color:var(--ink-soft);line-height:1.45;flex:1;}
.plan-day label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sage);font-weight:600;cursor:pointer;}

/* ---------- 달성률 링 & 주간 차트 ---------- */
.percent-ring{
  --pct:0;
  width:110px;height:110px;flex:none;border-radius:50%;
  background:conic-gradient(var(--gold) calc(var(--pct)*3.6deg), var(--paper-deep) 0deg);
  display:flex;align-items:center;justify-content:center;
  transition:background .3s ease;
}
.percent-ring-inner{
  width:84px;height:84px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.percent-ring-num{font-family:'Noto Serif KR',serif;font-weight:800;font-size:22px;color:var(--navy);}
.percent-ring-label{font-size:10px;color:var(--ink-soft);margin-top:2px;}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding:10px 2px 0;}
.chart-bar-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;}
.chart-bar-track{width:100%;max-width:22px;height:100px;background:var(--paper-deep);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;}
.chart-bar-fill{width:100%;background:linear-gradient(180deg,var(--gold),var(--sage));border-radius:6px 6px 0 0;transition:height .3s ease;min-height:2px;}
.chart-bar-val{font-size:10px;color:var(--ink-soft);font-weight:700;}
.chart-bar-label{font-size:9px;color:var(--ink-soft);white-space:nowrap;}

/* ---------- Memory verse cards ---------- */
.memtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.memtab{
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
}
.memtab.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.mem-list{display:grid;gap:10px;}
.mem-item{
  border:1px solid var(--line);background:var(--card);border-radius:10px;padding:13px 15px;
  display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
}
.mem-item.mem-done{border-color:var(--sage-soft);background:rgba(91,107,79,0.06);}
.mem-item .mi-ref{font-weight:700;color:var(--navy);font-family:'Noto Serif KR',serif;font-size:14.5px;}
.mem-item .mi-text{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.6;white-space:pre-wrap;}
.mem-actions{display:flex;gap:6px;flex:none;}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:7px;width:30px;height:30px;font-size:14px;color:var(--ink-soft);}
.icon-btn:hover{background:var(--paper-deep);}

/* Test mode */
.test-stage{max-width:480px;margin:0 auto;}
.test-progress{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
.diff-box{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card);margin-top:12px;font-size:13.5px;line-height:1.8;}
.diff-box .miss{background:rgba(139,74,66,0.16);color:var(--brick);padding:1px 3px;border-radius:3px;}
.diff-box .hit{background:rgba(91,107,79,0.14);color:var(--sage);padding:1px 3px;border-radius:3px;}
.score-tag{font-weight:700;font-size:15px;}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-nav{display:flex;gap:8px;align-items:center;}
.cal-month{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;color:var(--navy);min-width:130px;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{text-align:center;font-size:11.5px;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
.cal-cell{
  border:1px solid var(--line);border-radius:9px;background:var(--card);min-height:76px;
  padding:6px 7px;font-size:11.5px;position:relative;cursor:pointer;transition:background .15s;
}
.cal-cell:hover{background:var(--paper-deep);}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-cell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.cal-cell .cd-num{font-weight:700;color:var(--navy);}
.cal-dots{position:absolute;bottom:6px;left:7px;display:flex;gap:3px;}
.cal-dot{width:5px;height:5px;border-radius:50%;}
.dot-qt{background:var(--gold);}
.dot-fel{background:var(--brick);}
.dot-grace{background:var(--sage);}
.dot-event{background:var(--navy-soft);}
.dot-todo{background:#8E6BAA;}

/* ---------- 일정 / 할일 ---------- */
.list-nav{display:flex;align-items:center;gap:10px;margin:10px 0 14px;}
.list-nav span{font-size:12.5px;font-weight:700;color:var(--navy);flex:1;text-align:center;}
.todo-day-block{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.todo-day-header{
  font-family:'Noto Serif KR',serif;font-weight:700;color:var(--navy);font-size:13px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.todo-day-count{font-size:11.5px;font-weight:800;color:var(--sage);background:rgba(91,107,79,0.12);padding:2px 9px;border-radius:999px;}
.day-progress-bg{height:6px;border-radius:999px;background:var(--paper-deep);overflow:hidden;margin:9px 0 11px;}
.day-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--sage));border-radius:999px;transition:width .3s ease;}
.todo-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;}
.todo-time{font-size:11px;color:var(--ink-soft);min-width:44px;flex:none;}
.todo-title{flex:1;color:var(--ink);}
.todo-done-text{text-decoration:line-through;color:var(--ink-soft);}

/* 체크리스트형 할 일 표시 (동그란 상태 표시등) */
.todo-row2{display:flex;align-items:center;gap:11px;padding:7px 1px;font-size:13.5px;}
.todo-title2{flex:1;color:var(--ink);}
.done-text2{text-decoration:line-through;color:var(--ink-soft);}
.doing-tag{
  flex:none;font-size:10.5px;font-weight:800;color:#fff;background:var(--gold);
  padding:2px 9px;border-radius:999px;letter-spacing:.2px;
}
.todo-dot{
  width:25px;height:25px;flex:none;border-radius:50%;position:relative;cursor:pointer;
  border:2.5px solid #D8CEB4;background:#fff;transition:transform .15s ease, border-color .2s ease, background .2s ease;
}
.todo-dot:active{transform:scale(0.88);}
.todo-dot.state-todo{border-color:#D8CEB4;background:#fff;}
.todo-dot.state-doing{
  border-color:var(--gold);
  background:conic-gradient(var(--gold) 0deg 180deg, transparent 180deg 360deg);
  box-shadow:0 0 0 3px rgba(184,134,62,0.14);
}
.todo-dot.state-doing::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fffef9;}
.todo-dot.state-done{
  border-color:var(--sage);background:var(--sage);box-shadow:0 0 0 3px rgba(91,107,79,0.16);
}
.todo-dot.state-done::after{
  content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:900;
}
.subsection-title{font-size:13px;font-weight:700;color:var(--navy);margin:16px 0 8px;display:flex;align-items:center;gap:6px;}
.mini-add-row{display:flex;gap:6px;margin-top:8px;}
.mini-add-row input[type="text"], .mini-add-row input[type="time"]{
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;background:#fffef9;
}
.mini-add-row input[type="text"]{flex:1;}
.mini-add-row input[type="time"]{max-width:108px;}
.day-section{padding:14px 0;border-bottom:1px solid var(--line);}
.day-section:first-child{padding-top:2px;}
.day-section:last-child{border-bottom:none;}
.day-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;}
.test-log-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px;}
.test-log-mode{flex:none;}
.test-log-ref{flex:1;color:var(--ink);}
.test-log-score{font-weight:800;flex:none;font-size:13px;}

/* ---------- PDF 책자 (오프스크린 렌더용, html2canvas가 캡처) ---------- */
.booklet-page{width:794px;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--paper);}
.booklet-cover{
  min-height:1123px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(165deg,var(--navy) 0%,#2B3652 100%);color:#F3EDDC;padding:60px;
}
.booklet-cover h1{font-family:'Noto Serif KR',serif;font-size:38px;margin:14px 0;line-height:1.45;}
.booklet-cover .sub{font-size:15px;color:#CBC2A8;}
.booklet-divider{
  min-height:1123px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:60px;background:var(--paper-deep);
}
.booklet-divider h2{font-family:'Noto Serif KR',serif;font-size:30px;color:var(--navy);margin-bottom:10px;}
.booklet-divider .sub{font-size:14px;color:var(--ink-soft);}
.booklet-entry{min-height:1123px;padding:80px 64px;background:var(--card);}
.booklet-entry-date{font-family:'Noto Serif KR',serif;font-weight:700;color:var(--navy);font-size:21px;border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:26px;}
.booklet-row{margin-bottom:20px;}
.booklet-row .br-label{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.booklet-row .br-val{font-size:15.5px;line-height:1.95;white-space:pre-wrap;color:var(--ink);}
.ebook-checks{display:flex;gap:16px;font-size:13px;color:var(--ink);flex-wrap:wrap;}
.ebook-checks label{display:flex;align-items:center;gap:6px;font-weight:400;white-space:nowrap;}
.ebook-checks input[type="checkbox"],
.ebook-checks input[type="radio"]{
  width:auto;height:auto;padding:0;border:none;background:transparent;flex:none;accent-color:var(--gold);
}
.cover-theme-row{display:flex;gap:10px;}
.theme-swatch{width:44px;height:44px;border-radius:10px;cursor:pointer;position:relative;border:2px solid transparent;display:block;}
.theme-swatch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.theme-swatch.theme-navy{background:linear-gradient(165deg,#212B42,#2B3652);}
.theme-swatch.theme-dawn{background:linear-gradient(165deg,#8B4A42,#C08A3E);}
.theme-swatch.theme-sage{background:linear-gradient(165deg,#33402D,#5B6B4F);}
.theme-swatch.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,134,62,0.32);}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(33,27,10,0.45);display:none;
  align-items:center;justify-content:center;z-index:50;padding:16px;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--paper);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;
  padding:22px 22px 20px;box-shadow:0 12px 40px rgba(0,0,0,0.25);border:1px solid var(--line);
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-head h3{margin:0;font-size:17px;color:var(--navy);}
.close-x{border:none;background:transparent;font-size:20px;color:var(--ink-soft);line-height:1;}

/* ---------- Journal list ---------- */
.journal-entry{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
.journal-date{font-family:'Noto Serif KR',serif;font-weight:700;color:var(--navy);font-size:14.5px;margin-bottom:8px;}
.journal-row{margin-bottom:8px;}
.journal-row .jr-label{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.journal-row .jr-val{font-size:13.5px;line-height:1.65;white-space:pre-wrap;color:var(--ink);}

/* ---------- Fellowship ---------- */
.fel-item{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
.fel-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.fel-person{font-weight:700;color:var(--navy);font-family:'Noto Serif KR',serif;font-size:15px;}
.fel-meta{font-size:12px;color:var(--ink-soft);}
.fel-body{font-size:13.5px;color:var(--ink);line-height:1.7;margin-top:8px;white-space:pre-wrap;}
.fel-lesson{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--sage);white-space:pre-wrap;line-height:1.7;}

/* ---------- 기도노트 ---------- */
.prayer-item{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
.prayer-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;}
.prayer-title{font-weight:700;color:var(--navy);font-family:'Noto Serif KR',serif;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.prayer-meta{font-size:12px;color:var(--ink-soft);}
.prayer-body{font-size:13.5px;color:var(--ink);line-height:1.7;margin-top:8px;white-space:pre-wrap;}
.prayer-text{font-family:'Noto Serif KR',serif;font-size:13.5px;color:var(--navy-soft);line-height:1.85;margin-top:10px;padding:12px 15px;background:var(--paper-deep);border-radius:8px;white-space:pre-wrap;border-left:3px solid var(--gold-soft);}
.prayer-answer{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--sage);white-space:pre-wrap;line-height:1.7;}

/* ---------- Quotes ---------- */
.quote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.quote-card{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px;}
.quote-card p{font-family:'Noto Serif KR',serif;font-size:14px;line-height:1.75;margin:0 0 8px;color:var(--ink);}
.quote-card span{font-size:12px;color:var(--gold);font-weight:700;}

/* ---------- Bible text ---------- */
.notice{
  background:rgba(184,134,62,0.1);border:1px solid var(--gold-soft);border-radius:10px;
  padding:12px 15px;font-size:12.5px;color:var(--navy-soft);line-height:1.7;margin-bottom:16px;
}
.chapter-block{margin-bottom:16px;}
.chapter-block-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;cursor:pointer;}
.chapter-block-head h4{font-family:'Noto Serif KR',serif;font-size:14.5px;color:var(--navy);margin:0;}
.chapter-block textarea{
  display:block;width:100%;min-height:130px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;
  font-size:14px;line-height:1.8;background:#fffef9;color:var(--ink);resize:vertical;box-sizing:border-box;
}
.chapter-block textarea:focus{outline:2px solid var(--gold-soft);outline-offset:1px;border-color:var(--gold);}
.chapter-modal-textarea, textarea.chapter-modal-textarea{min-height:56vh;width:100%;font-size:15.5px;line-height:1.9;}
.bible-chapters-scroll{max-height:560px;overflow-y:auto;padding-right:6px;}
.book-select-box{
  margin:16px 0 14px;padding:16px;border-radius:12px;
  background:rgba(184,134,62,0.08);border:1.5px solid var(--gold);
}
.book-select-box label{
  display:block;font-size:15px;font-weight:700;color:var(--navy);margin-bottom:9px;
}
.book-select-box select{
  width:100%;padding:14px 16px;font-size:17px;font-weight:700;
  border:2px solid var(--gold);border-radius:10px;background:#fffef9;color:var(--navy);
  cursor:pointer;
}
.book-select-box select:focus{outline:2px solid var(--gold-soft);outline-offset:2px;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#F3EDDC;padding:10px 20px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .25s ease;z-index:80;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Gamification ---------- */
.points-chip{
  display:inline-flex;align-items:center;gap:6px;background:rgba(217,174,110,0.18);
  border:1px solid rgba(217,174,110,0.4);color:var(--gold-soft);
  padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:700;
}
.level-chip{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.18);color:#F3EDDC;
  padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:700;
}
.badge-mini-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.badge-mini{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);font-size:17px;
}
.badge-mini.locked{opacity:.28;filter:grayscale(1);}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.badge-card{
  border:1px solid var(--line);background:var(--card);border-radius:12px;padding:15px 16px;
  display:flex;gap:12px;align-items:flex-start;transition:opacity .2s ease;
}
.badge-card.locked{opacity:.5;}
.badge-icon{
  width:42px;height:42px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:rgba(184,134,62,0.14);
}
.badge-card.locked .badge-icon{background:var(--paper-deep);filter:grayscale(1);}
.badge-name{font-weight:700;color:var(--navy);font-size:14px;font-family:'Noto Serif KR',serif;}
.badge-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
.progress-mini-bg{height:5px;border-radius:999px;background:var(--paper-deep);margin-top:8px;overflow:hidden;}
.progress-mini-fill{height:100%;background:var(--gold);border-radius:999px;}
.progress-mini-label{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}

/* Voice recitation */
.voice-box{margin-top:8px;}
.rec-dot{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block;margin-right:6px;animation:pulse-dot 1s infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.3;}}
.transcript-box{
  border:1px solid var(--line);border-radius:10px;background:#fffef9;min-height:70px;
  padding:12px 14px;font-size:13.5px;line-height:1.7;margin:10px 0;color:var(--ink);
}
.mode-toggle{display:flex;gap:6px;margin:12px 0;}

/* ---------- Auth screen ---------- */
.auth-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 15% 8%, rgba(184,134,62,0.09), transparent 40%),
    radial-gradient(circle at 90% 85%, rgba(91,107,79,0.09), transparent 45%);
}
.auth-card{
  width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:30px 26px;box-shadow:var(--shadow);
}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;justify-content:center;}
.auth-brand .brand-flame{width:30px;height:30px;}
.auth-brand-title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:19px;color:var(--navy);}
.auth-tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--paper-deep);padding:4px;border-radius:10px;}
.auth-tab{flex:1;border:none;background:transparent;padding:8px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-soft);}
.auth-tab.active{background:var(--navy);color:#F7F1E1;}
.auth-error{font-size:12.5px;color:var(--brick);margin-top:8px;min-height:16px;}
.auth-loading{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-soft);z-index:100;}

/* ---------- Account tab ---------- */
.account-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
.account-row:last-child{border-bottom:none;}
.account-row .ar-label{font-size:13.5px;font-weight:600;color:var(--navy);}
.account-row .ar-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}

/* ---------- Coupang products ---------- */
.coupang-disclosure{
  font-size:11.5px;color:var(--ink-soft);background:var(--paper-deep);border-radius:8px;
  padding:9px 12px;margin-bottom:16px;line-height:1.6;
}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.product-card{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;}
.product-name{font-weight:700;color:var(--navy);font-size:13.5px;font-family:'Noto Serif KR',serif;}
.product-note{font-size:12px;color:var(--ink-soft);line-height:1.5;flex:1;}
.product-price{font-size:13px;color:var(--gold);font-weight:700;}
.product-link{text-align:center;margin-top:4px;}

}

/* =========================================================
   읽기표 생성 (66권을 365일에 균등 분배)
   ========================================================= */
function flattenBooks(list){
  const out=[];
  list.forEach(([name,ch])=>{ for(let i=1;i<=ch;i++) out.push(`${name} ${i}장`); });
  return out;
}
function chunkEvenly(arr, buckets){
  const res = Array.from({length:buckets},()=>[]);
  const base = Math.floor(arr.length/buckets);
  let rem = arr.length % buckets;
  let idx=0;
  for(let b=0;b<buckets;b++){
    let count = base + (b < rem ? 1 : 0);
    for(let i=0;i<count;i++){ res[b].push(arr[idx++]); }
  }
  return res;
}
let READING_PLAN = null;
function buildReadingPlan(){
  if(READING_PLAN) return READING_PLAN;
  const otFlat = flattenBooks(BOOKS);
  const ntFlat = flattenBooks(NT_BOOKS);
  const DAYS = 365;
  const otChunks = chunkEvenly(otFlat, DAYS);
  const ntChunks = chunkEvenly(ntFlat, DAYS);
  READING_PLAN = otChunks.map((ot,i)=> ot.concat(ntChunks[i]));
  return READING_PLAN;
}

function computeWeeklyReadingCounts(){
  const dates = Object.values(state.readingProgress).filter(v=>typeof v==="string");
  const buckets = {};
  dates.forEach(ds=>{
    const d = new Date(ds+"T00:00:00");
    const day = d.getDay();
    const start = new Date(d); start.setDate(d.getDate()-day);
    const key = dstr(start);
    buckets[key] = (buckets[key]||0)+1;
  });
  const todayStart = new Date(TODAY); todayStart.setDate(TODAY.getDate()-TODAY.getDay());
  const weeks = [];
  for(let i=11;i>=0;i--){
    const d = new Date(todayStart); d.setDate(todayStart.getDate()-i*7);
    const key = dstr(d);
    weeks.push({label:`${d.getMonth()+1}/${d.getDate()}`, count: buckets[key]||0});
  }
  return weeks;
}
function renderReadingChart(){
  const weeks = computeWeeklyReadingCounts();
  const max = Math.max(1, ...weeks.map(w=>w.count));
  return `<div class="chart-bars">
    ${weeks.map(w=>`
      <div class="chart-bar-col">
        <div class="chart-bar-track"><div class="chart-bar-fill" style="height:${Math.round(w.count/max*100)}%"></div></div>
        <div class="chart-bar-val">${w.count}</div>
        <div class="chart-bar-label">${w.label}</div>
      </div>`).join("")}
  </div>`;
}

function bindPlan(){

function groupTestLogByDate(){

  return Object.entries(groups).sort((a,b)=> b[0].localeCompare(a[0]));
}
function scoreColor(pct){ return pct>=85 ? "var(--sage)" : pct>=50 ? "var(--gold)" : "var(--brick)"; }
function renderTestLog(){
  const groups = groupTestLogByDate();

function startTest(catId){

/* ---------- 음성 인식 (Web Speech API) ---------- */
function startVoiceTest(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showToast("이 브라우저는 음성 인식을 지원하지 않아요. Chrome에서 열어주세요."); return; }
  ui.recording = true; ui.transcriptFinal=""; ui.transcriptInterim="";
  renderTestArea();
  let lastFinalChunk = "";
  try{
    recognition = new SR();
    recognition.lang = "ko-KR";
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (e)=>{
      let interim="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal){
          const trimmed = t.trim();
          // 안드로이드 일부 기기에서 같은 구간이 중복 확정되는 경우를 대비한 안전장치
          if(trimmed && trimmed!==lastFinalChunk){
            ui.transcriptFinal += t;
            lastFinalChunk = trimmed;
          }
        } else {
          interim += t;
        }
      }
      ui.transcriptInterim = interim;
      const box = document.getElementById("transcriptBox");
      if(box) box.innerHTML = escapeHtml(ui.transcriptFinal)+'<span style="color:var(--ink-soft)">'+escapeHtml(ui.transcriptInterim)+'</span>';
      const gb = document.getElementById("gradeAudioBtn");
      if(gb) gb.disabled = !ui.transcriptFinal;
    };
    recognition.onerror = (e)=>{
      if(e.error==="no-speech" || e.error==="aborted") return;
      showToast("음성 인식 오류: "+e.error);
    };
    // 안드로이드 기기에서는 인식이 스스로 끊긴 뒤 즉시 재시작하면 같은 구간을 다시 확정 처리해
    // 문장이 중복 반복되는 문제가 있어, 자동 재시작 없이 멈추고 사용자가 다시 눌러 이어가도록 했어요.
    recognition.onend = ()=>{
      if(ui.recording){
        ui.recording = false;
        const btn = document.getElementById("recBtn");
        if(btn){ btn.className = "btn sage small"; btn.innerHTML = "🎙️ 녹음 시작"; }
        if(ui.transcriptFinal) showToast("녹음이 잠시 멈췄어요. 이어서 하시려면 다시 눌러주세요.");
      }
    };
    recognition.start();
  }catch(e){
    showToast("마이크를 사용할 수 없어요.");
    ui.recording = false; renderTestArea();
  }
}
function stopVoiceTest(){
  ui.recording = false;
  if(recognition){ try{ recognition.onend=null; recognition.stop(); }catch(e){} }
}
function diffScore(original, typed){
  const oWords = original.trim().split(/\s+/).filter(Boolean);
  const tWords = typed.trim().split(/\s+/).filter(Boolean);
  // LCS 기반 단어 매칭
  const m=oWords.length, n=tWords.length;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = oWords[i-1]===tWords[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  }
  const matched = dp[m][n];
  const pct = oWords.length ? Math.round((matched/oWords.length)*100) : 0;
  // 원문 기준으로 일치/누락 표시
  let i=m,j=n; const marks = new Array(m).fill("miss");
  while(i>0&&j>0){
    if(oWords[i-1]===tWords[j-1]){ marks[i-1]="hit"; i--; j--; }
    else if(dp[i-1][j]>=dp[i][j-1]) i--; else j--;
  }
  const html = oWords.map((w,idx)=>`<span class="${marks[idx]}">${escapeHtml(w)}</span>`).join(" ");
  return {pct, html};
}

function ensureEntry(dateKey){
  if(!state.dailyEntries[dateKey]) state.dailyEntries[dateKey]={qt:"",verse:"",prayer:"",grace:"",application:"",thanks:"",events:[],todos:[]};
  const e = state.dailyEntries[dateKey];
  if(!e.events) e.events=[];
  if(!e.todos) e.todos=[];
  return e;
}
function statusMeta(status){
  if(status==="done") return {icon:"✅", label:"완료", cls:"status-done"};
  if(status==="doing") return {icon:"◐", label:"진행 중", cls:"status-doing"};
  return {icon:"○", label:"대기", cls:"status-todo"};
}
function nextStatus(s){ return s==="todo" ? "doing" : s==="doing" ? "done" : "todo"; }
function getWeekRange(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay();
  const start = new Date(d); start.setDate(d.getDate()-day);
  const end = new Date(start); end.setDate(start.getDate()+6);
  return { start, end };
}
function shiftListRef(delta){
  const d = new Date(ui.listRefDate+"T00:00:00");
  if(ui.listMode==="week") d.setDate(d.getDate()+delta*7);
  else d.setDate(d.getDate()+delta);
  ui.listRefDate = dstr(d);
}
function listRangeLabel(){
  if(ui.listMode==="day") return fmtDateKor(ui.listRefDate);
  if(ui.listMode==="week"){
    const {start,end} = getWeekRange(ui.listRefDate);
    return `${fmtDateKor(dstr(start))} ~ ${fmtDateKor(dstr(end))}`;
  }
  return `${ui.calYear}년 ${ui.calMonth+1}월 전체`;
}
function renderDayTodoBlock(dateKey){
  const e = state.dailyEntries[dateKey];
  const todos = (e && e.todos) || [];
  const done = todos.filter(t=>t.status==="done").length;
  const pct = todos.length ? Math.round((done/todos.length)*100) : 0;
  return `<div class="todo-day-block">
    <div class="todo-day-header">
      <span>${fmtDateKor(dateKey)}${dateKey===dstr(TODAY)?' <span class="badge gold">오늘</span>':""}</span>
      ${todos.length?`<span class="todo-day-count">${done}/${todos.length}</span>`:""}
    </div>
    ${todos.length?`<div class="day-progress-bg"><div class="day-progress-fill" style="width:${pct}%"></div></div>`:""}
    ${todos.length ? todos.map(t=>{
      const sm = statusMeta(t.status);
      return `<div class="todo-row2">
        <button class="todo-dot state-${t.status}" data-lcyc="${dateKey}|${t.id}" title="${sm.label} · 눌러서 상태 변경"></button>
        <span class="todo-title2 ${t.status==="done"?"done-text2":""}">${escapeHtml(t.title)}</span>
        ${t.status==="doing"?'<span class="doing-tag">진행 중</span>':""}
      </div>`;
    }).join("") : `<div class="empty" style="padding:8px;font-size:12px;">할 일 없음</div>`}
  </div>`;
}
function renderTodoListView(){
  if(ui.listMode==="day") return renderDayTodoBlock(ui.listRefDate);
  if(ui.listMode==="week"){
    const {start} = getWeekRange(ui.listRefDate);
    let html="";
    for(let i=0;i<7;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      html += renderDayTodoBlock(dstr(d));
    }
    return html;
  }
  // month
  const prefix = `${ui.calYear}-${String(ui.calMonth+1).padStart(2,"0")}`;
  const daysInMonth = new Date(ui.calYear, ui.calMonth+1, 0).getDate();
  let blocks=[];
  for(let d=1; d<=daysInMonth; d++){
    const key = `${prefix}-${String(d).padStart(2,"0")}`;
    const e = state.dailyEntries[key];
    if(e && e.todos && e.todos.length) blocks.push(renderDayTodoBlock(key));
  }
  return blocks.length ? blocks.join("") : `<div class="empty">이번 달에 등록된 할 일이 없어요.</div>`;
}

    const before = snapshotGamify();
    const e = ensureEntry(dateKey);
    const t = e.todos.find(x=>x.id===b.dataset.cyc);
    t.status = nextStatus(t.status);
    persist("dailyEntries");
    refreshEventTodoLists(dateKey);
    announceGamify(before);
  }));
  document.querySelectorAll("[data-deltd]").forEach(b=>b.addEventListener("click",()=>{
    const e = ensureEntry(dateKey);
    e.todos = e.todos.filter(x=>x.id!==b.dataset.deltd);
    persist("dailyEntries");
    refreshEventTodoLists(dateKey);
  }));
}

/* ---------- 일정 추가/편집 전용 모달 (다른 항목과 섞이지 않음) ---------- */
function openEventModal(dateKey, eventId){
  const entry = ensureEntry(dateKey);

  const ev = existing || {id:uid(), time:"", title:""};
  document.getElementById("modalBody").innerHTML = `
    <div class="modal-head"><h3>🗓️ 일정 ${existing?"편집":"추가"}</h3><button class="close-x" id="modalClose">✕</button></div>

      <button class="btn ghost" id="backToDay">‹ 뒤로</button>
    </div>`;
  openModal();
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("backToDay").addEventListener("click", ()=> openDayModal(dateKey));
  document.getElementById("saveEvent").addEventListener("click",()=>{

/* ---------- 할 일 추가/편집 전용 모달 (다른 항목과 섞이지 않음) ---------- */
function openTodoModal(dateKey, todoId){
  const entry = ensureEntry(dateKey);

  const td = existing || {id:uid(), title:"", status:"todo"};
  document.getElementById("modalBody").innerHTML = `
    <div class="modal-head"><h3>✅ 할 일 ${existing?"편집":"추가"}</h3><button class="close-x" id="modalClose">✕</button></div>

        <label><input type="radio" name="td_status" value="doing" ${td.status==="doing"?"checked":""}> 진행 중</label>

    const before = snapshotGamify();

/* ---------- QT·묵상 전용 모달 (일정/할일과 섞이지 않음) ---------- */
function openQtModal(dateKey){

function renderPrayerCard(p){

  return `

    ${p.prayerText?`<div class="prayer-text">"${escapeHtml(p.prayerText)}"</div>`:""}
    ${p.status==="answered" && p.answer?`<div class="prayer-answer">🌾 응답: ${escapeHtml(p.answer)}${p.answeredDate?` (${fmtDateKor(p.answeredDate)})`:""}</div>`:""}

}

function bindPrayer(){

function inRangeDate(dateKey, opts){
  if(opts.range==="month"){
    const prefix = `${TODAY.getFullYear()}-${String(TODAY.getMonth()+1).padStart(2,"0")}`;
    return dateKey.startsWith(prefix);
  }
  if(opts.range==="custom"){
    if(opts.start && dateKey < opts.start) return false;
    if(opts.end && dateKey > opts.end) return false;
    return true;
  }
  return true; // all
}
function getBookletEntries(opts){
  const journal = Object.entries(state.dailyEntries)
    .filter(([k,v])=> (v.grace||v.application||v.thanks) && inRangeDate(k,opts))
    .sort((a,b)=> a[0].localeCompare(b[0]));
  const fellowship = state.fellowship
    .filter(f=> f.lessons && f.lessons.trim() && f.date && inRangeDate(f.date,opts))
    .sort((a,b)=> (a.date||"").localeCompare(b.date||""));
  const prayers = state.prayers
    .filter(p=> p.title && p.date && inRangeDate(p.date,opts))
    .sort((a,b)=> (a.date||"").localeCompare(b.date||""));
  return { journal, fellowship, prayers };
}

async function buildAndDownloadBooklet(opts, journal, fellowship, prayers, onProgress){
  if(!window.html2canvas || !window.jspdf){ throw new Error("PDF 라이브러리를 불러오지 못했어요."); }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"pt", format:"a4"});
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  let first = true;
  const total = 2 + journal.length + fellowship.length + prayers.length
    + (journal.length?1:0) + (fellowship.length?1:0) + (prayers.length?1:0);
  let done = 0;

  async function addNode(node){
    document.body.appendChild(node);
    const canvas = await html2canvas(node, {scale:2, backgroundColor:"#ffffff", useCORS:true});
    node.remove();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const imgData = canvas.toDataURL("image/jpeg", 0.95);
    let heightLeft = imgHeight, position = 0;
    if(!first) pdf.addPage();
    first = false;
    pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    done++; if(onProgress) onProgress(done, total);
  }

  await addNode(makeCoverNode(opts, journal.length, fellowship.length, prayers.length));
  if(journal.length){
    await addNode(makeDividerNode("묵상노트", "그날 받은 은혜와 삶의 적용, 감사의 기록"));
    for(const [dateKey, e] of journal) await addNode(makeBookletNode("booklet-entry", journalEntryHTML(dateKey, e)));
  }
  if(prayers.length){
    await addNode(makeDividerNode("기도노트", "드린 기도와 그 응답의 기록"));
    for(const p of prayers) await addNode(makeBookletNode("booklet-entry", prayerEntryHTML(p)));
  }
  if(fellowship.length){
    await addNode(makeDividerNode("교제와 배운 것", "만남을 통해 나누고 깨달은 것들"));
    for(const f of fellowship) await addNode(makeBookletNode("booklet-entry", fellowshipEntryHTML(f)));
  }
  await addNode(makeClosingNode());

  const safeTitle = (opts.title||"은혜의 기록").replace(/[\\/:*?"<>|]/g,"");
  pdf.save(`${safeTitle}_${dstr(TODAY)}.pdf`);
}
async function handleGeneratePdf(){
  const opts = collectBookletOptions();
  const {journal, fellowship, prayers} = getBookletEntries(opts);
  const jn = opts.incJournal ? journal : [];
  const fn = opts.incFel ? fellowship : [];
  const pn = opts.incPrayer ? prayers : [];
  if(jn.length===0 && fn.length===0 && pn.length===0){ showToast("포함할 기록이 없어요. 조건을 확인해 주세요."); return; }
  if(jn.length+fn.length+pn.length > 60){
    if(!confirm(`기록이 총 ${jn.length+fn.length+pn.length}건으로 많아 생성에 시간이 걸릴 수 있어요. 계속할까요?`)) return;
  }
  const btn = document.getElementById("ebk_genBtn");
  const origText = btn.textContent;
  btn.disabled = true;
  try{
    const before = snapshotGamify();
    await buildAndDownloadBooklet(opts, jn, fn, pn, (done,total)=>{ btn.textContent = `생성 중… (${done}/${total})`; });
    state.gamifyCounts.bookletsMade = (state.gamifyCounts.bookletsMade||0)+1;
    persist("gamifyCounts");
    showToast("PDF 책자를 만들었어요!");
    announceGamify(before);
  }catch(e){
    showToast("PDF 생성에 실패했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.");
  }finally{
    btn.disabled = false; btn.textContent = origText;
  }
}

          <div class="product-note">${escapeHtml(p.note)}</div>
          ${p.price?`<div class="product-price">${escapeHtml(p.price)}</div>`:""}
          <div class="product-link">
            ${p.link ? `<a class="btn gold small" href="${p.link}" target="_blank" rel="noopener nofollow sponsored" style="text-decoration:none;">쿠팡에서 보기</a>`
                     : `<button class="btn ghost small" disabled>링크 준비 중</button>`}
          </div>
        </div>`).join("")}
    </div>
  </div>`;
}

    <div class="account-row">

function bindAccount(){
  document.getElementById("logoutBtn").addEventListener("click",()=> auth.signOut());
  document.getElementById("exportBtn").addEventListener("click", exportData);
  document.getElementById("importFile").addEventListener("change",(e)=>{
    const f = e.target.files[0]; if(f) importDataFromFile(f);
  });
  document.getElementById("resetBtn").addEventListener("click",()=>{
    if(confirm("정말 모든 데이터를 초기화할까요? 이 작업은 되돌릴 수 없어요.")) resetAllData();
  });
  document.getElementById("deleteAccBtn").addEventListener("click",()=>{
    if(confirm("정말 회원 탈퇴하시겠어요? 계정과 모든 데이터가 영구히 삭제돼요.")){
      if(confirm("마지막 확인이에요. 되돌릴 수 없어요. 계속할까요?")) deleteAccountAndData();
    }
  });
  bindEbookSection();
}

   렌더 오케스트레이션
   ========================================================= */
function renderAll(){
  renderTabbar();
  document.getElementById("todayPill").textContent = fmtDateKor(dstr(TODAY));
  const panels = document.getElementById("panels");
  let html="";
  switch(ui.tab){
    case "home": html = renderHome(); break;
    case "bible": html = renderBible(); break;
    case "plan": html = renderPlan(); break;
    case "memory": html = renderMemory(); break;
    case "calendar": html = renderCalendar(); break;
    case "journal": html = renderJournal(); break;
    case "prayer": html = renderPrayer(); break;
    case "fellowship": html = renderFellowship(); break;
    case "badges": html = renderBadges(); break;
    case "shop": html = renderShop(); break;
    case "quotes": html = renderQuotes(); break;
    case "account": html = renderAccount(); break;
  }
  panels.innerHTML = `<div class="panel active">${html}</div>`;
  switch(ui.tab){
    case "home": bindHome(); break;
    case "bible": bindBible(); break;
    case "plan": bindPlan(); break;
    case "memory": bindMemory(); break;
    case "calendar": bindCalendar(); break;
    case "journal": bindJournal(); break;
    case "prayer": bindPrayer(); break;
    case "fellowship": bindFellowship(); break;
    case "account": bindAccount(); break;
  }
}

/* =========================================================
   인증 화면 (로그인 / 회원가입)
   ========================================================= */
let authMode = "login";
function setAuthMode(mode){
  authMode = mode;
  document.getElementById("authTabLogin").classList.toggle("active", mode==="login");
  document.getElementById("authTabSignup").classList.toggle("active", mode==="signup");
  document.getElementById("authSubmit").textContent = mode==="login" ? "로그인" : "회원가입";
  document.getElementById("authError").textContent = "";
}
function authErrorMessage(code){
  const map = {
    "auth/invalid-email":"이메일 형식이 올바르지 않아요.",
    "auth/user-not-found":"등록되지 않은 이메일이에요.",
    "auth/wrong-password":"비밀번호가 일치하지 않아요.",
    "auth/invalid-credential":"이메일 또는 비밀번호가 올바르지 않아요.",
    "auth/email-already-in-use":"이미 가입된 이메일이에요. 로그인해 주세요.",
    "auth/weak-password":"비밀번호는 6자 이상이어야 해요.",
    "auth/too-many-requests":"시도가 너무 많아요. 잠시 후 다시 시도해 주세요.",
    "auth/operation-not-allowed":"이메일/비밀번호 로그인이 아직 꺼져 있어요. Firebase 콘솔의 Authentication > 로그인 방법에서 켜주세요.",
    "auth/unauthorized-domain":"이 웹 주소가 Firebase에 등록되어 있지 않아요. Authentication > Settings > 승인된 도메인에 이 주소를 추가해 주세요.",
    "auth/invalid-api-key":"firebaseConfig의 apiKey 값이 올바르지 않아요. Firebase 콘솔 값과 다시 대조해 주세요.",
    "auth/api-key-not-valid.-please-pass-a-valid-api-key.":"firebaseConfig의 apiKey 값이 올바르지 않아요. Firebase 콘솔 값과 다시 대조해 주세요.",
    "auth/network-request-failed":"네트워크 연결을 확인해 주세요.",
    "auth/configuration-not-found":"Authentication에서 이메일/비밀번호 로그인 방법이 켜져 있는지 확인해 주세요."
  };
  return map[code] || `문제가 발생했어요${code?` (${code})`:""}. 잠시 후 다시 시도해 주세요.`;
}
function bindAuthScreen(){
  document.getElementById("authTabLogin").addEventListener("click",()=>setAuthMode("login"));
  document.getElementById("authTabSignup").addEventListener("click",()=>setAuthMode("signup"));
  document.getElementById("authSubmit").addEventListener("click", async ()=>{
    const email = document.getElementById("authEmail").value.trim();
    const pw = document.getElementById("authPw").value;
    const errEl = document.getElementById("authError");
    errEl.textContent = "";
    if(!email || !pw){ errEl.textContent = "이메일과 비밀번호를 입력해 주세요."; return; }
    try{
      if(authMode==="login"){
        await auth.signInWithEmailAndPassword(email, pw);
      } else {
        await auth.createUserWithEmailAndPassword(email, pw);
      }
    }catch(e){ errEl.textContent = authErrorMessage(e.code); }
  });
  document.getElementById("authResetPw").addEventListener("click", async ()=>{
    const email = document.getElementById("authEmail").value.trim();
    const errEl = document.getElementById("authError");
    if(!email){ errEl.textContent = "비밀번호를 재설정할 이메일을 입력해 주세요."; return; }
    try{
      await auth.sendPasswordResetEmail(email);
      errEl.style.color = "var(--sage)";
      errEl.textContent = "재설정 메일을 보냈어요. 받은편지함을 확인해 주세요.";
    }catch(e){ errEl.style.color=""; errEl.textContent = authErrorMessage(e.code); }
  });
}

/* =========================================================
   부트스트랩
   ========================================================= */
bindAuthScreen();
auth.onAuthStateChanged(async (user)=>{
  document.getElementById("authLoading").style.display = "none";
  if(user){
    currentUser = user;
    document.getElementById("authScreen").style.display = "none";
    document.getElementById("mainApp").style.display = "block";
    await loadAllFromFirestore();
    renderAll();
  } else {
    currentUser = null;
    document.getElementById("mainApp").style.display = "none";
    document.getElementById("authScreen").style.display = "flex";
  }
});

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
